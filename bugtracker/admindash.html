<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300&icon_names=developer_board,event,logout,mail,notifications" rel="stylesheet" />
    <link rel="stylesheet" href="admindash.css">
    <title>Document</title>
</head>
<body>
    
    <div class="container">


        <aside class="side-bar-container">
            <div class="side-bar-profile">
                <img src="profile.png" alt="" class="side-bar-profile-picture">
                <i class="material-symbols-outlined">
                logout
                </i>
                <i class="material-symbols-outlined">
                    notifications
                </i>
            </div>
            <div class="side-bar-settings">
                <i class="material-symbols-outlined">
                    event
                </i> 
                <i class="material-symbols-outlined">
                    mail
                </i>   
                <i class="material-symbols-outlined">
                    developer_board
                </i>   
            </div>
            <div class="side-bar-todo">
                <p>ToDo</p>
                <p>Done</p>
            </div>
        </aside>


        <aside class="secondary-bar-container">
            <div class="secondary-bar-header">
                <h3>Bugtracker</h3>
            </div>
            <div class="secondary-bar-tickets">
                <ul>
                    <li>Meine Tickets</li>
                    <li>Alle Tickets</li>
                </ul>
            </div>
        </aside>


        <section class="hero">
            dsd
        </section>

        <aside class="news-feed">
            news
        </aside>

    </div>



</body>
</html>
